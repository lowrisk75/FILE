global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'file-relay-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # FILE Relay Server metrics
  - job_name: 'file-relay-server'
    static_configs:
      - targets:
          - relay-server:8081
        labels:
          service: 'relay-server'
          component: 'relay'

    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: 'prometheus'

  # Alertmanager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: 'alertmanager'
