apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-relay-server
  namespace: file-network
  labels:
    app: file-relay
    component: relay-server
    version: v0.1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: file-relay
      component: relay-server
  template:
    metadata:
      labels:
        app: file-relay
        component: relay-server
        version: v0.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: file-relay-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: relay-server
        image: ghcr.io/file-network/relay-server:v0.1.0
        imagePullPolicy: IfNotPresent

        ports:
        - name: quic
          containerPort: 8080
          protocol: UDP
        - name: health
          containerPort: 8081
          protocol: TCP

        env:
        - name: RUST_LOG
          value: "info,relay_server=debug"
        - name: RUST_BACKTRACE
          value: "1"

        args:
        - "--bind"
        - "0.0.0.0:8080"
        - "--health-port"
        - "8081"
        - "--max-peers"
        - "1000"
        - "--capow-timeout"
        - "100"

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"

        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /.cache

      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: cache
        emptyDir:
          sizeLimit: 100Mi

      terminationGracePeriodSeconds: 10

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: file-relay
                  component: relay-server
              topologyKey: kubernetes.io/hostname

        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - c6a.large
                - c6a.xlarge

      tolerations:
      - key: "relay-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: file-relay-server
  namespace: file-network
  labels:
    app: file-relay
    component: relay-server
spec:
  type: LoadBalancer
  loadBalancerClass: external
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

  ports:
  - name: quic
    port: 8080
    targetPort: quic
    protocol: UDP

  selector:
    app: file-relay
    component: relay-server

---
apiVersion: v1
kind: Service
metadata:
  name: file-relay-server-metrics
  namespace: file-network
  labels:
    app: file-relay
    component: relay-server
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  clusterIP: None

  ports:
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP

  selector:
    app: file-relay
    component: relay-server

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-relay-server
  namespace: file-network
  labels:
    app: file-relay
    component: relay-server

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: file-relay-server
  namespace: file-network
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: file-relay
      component: relay-server

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-relay-server
  namespace: file-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-relay-server

  minReplicas: 3
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  - type: Pods
    pods:
      metric:
        name: file_relay_active_peers
      target:
        type: AverageValue
        averageValue: "800"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
