version: '3.8'

services:
  relay-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: file-relay-server:latest
    container_name: file-relay-server
    restart: unless-stopped

    ports:
      - "8080:8080/udp"  # QUIC relay port
      - "8081:8081/tcp"  # Health check + metrics

    environment:
      RUST_LOG: "info,relay_server=debug"
      RUST_BACKTRACE: "1"

    command:
      - "--bind"
      - "0.0.0.0:8080"
      - "--health-port"
      - "8081"
      - "--max-peers"
      - "1000"
      - "--capow-timeout"
      - "100"

    networks:
      - file-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100M

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: file-relay-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

    networks:
      - file-network

    depends_on:
      - relay-server

  grafana:
    image: grafana/grafana:10.1.0
    container_name: file-relay-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/file-relay-dashboard.json

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

    networks:
      - file-network

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: file-relay-alertmanager
    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

    networks:
      - file-network

    depends_on:
      - prometheus

networks:
  file-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
