version: '3.8'

# Production Docker Compose configuration for FILE Relay Server
# This example demonstrates a production-grade deployment with:
# - Resource limits
# - Health checks
# - Logging configuration
# - Restart policies
# - Security hardening

services:
  relay-server:
    image: ghcr.io/file-network/relay-server:latest
    container_name: file-relay-production
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Network ports
    ports:
      - "8080:8080/udp"  # QUIC relay traffic
      - "8081:8081/tcp"  # Metrics and health checks (bind to localhost only)

    # Environment variables
    environment:
      - RUST_LOG=info
      - MAX_PEERS=1000
      - METRICS_ADDR=0.0.0.0:8081

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=100M

    # Labels for monitoring
    labels:
      - "service=file-relay"
      - "environment=production"
      - "version=latest"

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - relay-server

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: file-relay-network
