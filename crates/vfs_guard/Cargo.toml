[package]
name = "vfs_guard"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime for non-blocking I/O
tokio = { version = "1.52", features = ["fs", "io-util", "sync", "rt", "rt-multi-thread", "macros"] }

# Error handling
thiserror = "2.0"

# Serialization (for config/whitelist)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SIMD intrinsics
packed_simd_2 = { version = "0.3", optional = true }

# Logging
log = "0.4"

[dev-dependencies]
tokio = { version = "1.52", features = ["fs", "io-util", "sync", "rt", "macros", "rt-multi-thread"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.12"

[features]
default = []
simd = ["packed_simd_2"]

[lib]
name = "vfs_guard"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]
