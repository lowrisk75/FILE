[package]
name = "relay_server"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Nadjarian <mail@kevinn.ie>"]
description = "FILE Relay Server - MPQUIC P2P Relay with CAPoW Anti-DDoS"

[[bin]]
name = "file-relay"
path = "src/main.rs"

[dependencies]
# Internal crates
core_transport = { path = "../core_transport" }
relay_daemon = { path = "../relay_daemon" }
crypto_fabric = { path = "../crypto_fabric" }

# Workspace dependencies
tokio = { workspace = true }
ant-quic = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
hex = "0.4"
bincode = "1.3"  # For MtpProof deserialization
num_cpus = "1.16"  # For crypto worker pool sizing
dashmap = "6.1"  # For concurrent rate limiting per IP

# GDPR-compliant IP hashing
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# HTTP health check / metrics endpoint
axum = "0.7"
tower = "0.4"
